<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shams English Platform</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#1d2433;--mu:#5d6679;--pr:#4f46e5;--pr2:#7c3aed;--pl:#eef0ff;--bd:#e3e6ef;--ok:#16a34a;--okb:#dcfce7;--bad:#dc2626;--badb:#fee2e2;--unc:#b45309;--uncb:#fef3c7;--hl:#ffe83a;--r:14px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10131c;--card:#1a1f2d;--tx:#eef0f6;--mu:#a2abc0;--pl:#262c47;--bd:#2c3347;--okb:#14391f;--badb:#4a1d1d;--uncb:#3f2f0c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10131c;--card:#1a1f2d;--tx:#eef0f6;--mu:#a2abc0;--pl:#262c47;--bd:#2c3347;--okb:#14391f;--badb:#4a1d1d;--uncb:#3f2f0c;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:70px}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:env(safe-area-inset-bottom,0)}
a{color:var(--pr)}
.skip{position:absolute;left:-999px;top:0;background:var(--pr);color:#fff;padding:8px 12px;z-index:50}.skip:focus{left:8px;top:8px}
:focus-visible{outline:3px solid #f59e0b;outline-offset:2px}
header.top{background:linear-gradient(135deg,var(--pr),var(--pr2));color:#fff;margin:0;padding:env(safe-area-inset-top,0) 14px 8px;position:sticky;top:0;z-index:20}
header.top .bar1{display:flex;align-items:center;gap:10px;flex-wrap:wrap;max-width:1100px;margin:0 auto}
header.top h1{margin:0;font-size:1.15rem;flex:1;min-width:150px;cursor:pointer}
header.top nav{display:flex;gap:4px;overflow-x:auto;max-width:100%}
header.top nav a{color:#fff;text-decoration:none;padding:6px 11px;border-radius:18px;font-weight:600;font-size:.88rem;white-space:nowrap;border:1px solid transparent}
header.top nav a:hover{background:rgba(255,255,255,.18)}header.top nav a.on{background:rgba(255,255,255,.28);border-color:rgba(255,255,255,.5)}
.badge{display:inline-block;background:#ffe83a;color:#222;border-radius:10px;padding:0 7px;font-size:.75rem;margin-left:4px;font-weight:800}
main{max-width:1100px;margin:0 auto;padding:16px;outline:0}
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:16px;margin:0 0 14px}
.card.stg{background:var(--pl);border-color:var(--pr)}
h2{margin:6px 0 10px}h3{margin:0 0 6px}h4{margin:10px 0 4px}
.btn{border:0;background:var(--pr);color:#fff;padding:9px 15px;border-radius:10px;font:inherit;font-weight:600;cursor:pointer;text-decoration:none;display:inline-block}
.btn.s{background:var(--pl);color:var(--pr)}.btn.d{background:var(--bad)}.btn:disabled{opacity:.5;cursor:not-allowed}.btn:active{transform:scale(.97)}
.btn.sm{padding:5px 10px;font-size:.85rem}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:8px 0}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.g3{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.note{font-size:.85rem;color:var(--mu)}.tag{font-size:.74rem;font-weight:800;text-transform:uppercase;color:var(--pr);letter-spacing:.03em;margin:8px 0 2px}
.ar{direction:rtl;text-align:right}.ipa{font-family:"Segoe UI",Arial,sans-serif;color:var(--pr)}
.chip{display:inline-block;background:var(--pl);color:var(--pr);padding:3px 11px;border-radius:14px;margin:2px;font-size:.9rem;border:0;cursor:pointer;font-family:inherit}
.chip.used{background:var(--ok);color:#fff}
.bar{height:10px;background:var(--bd);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pr),var(--pr2));width:0;transition:width .4s}
.bar.ok i{background:var(--ok)}
.hero{background:linear-gradient(135deg,var(--pr),var(--pr2));color:#fff;border-radius:var(--r);padding:20px;margin-bottom:14px}
.hero h2{margin:0 0 4px}.hero .bar{background:rgba(255,255,255,.3);max-width:480px}.hero .bar i{background:#ffe83a}
.hero .btn{background:#fff;color:var(--pr)}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.scard{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:6px;text-decoration:none;color:inherit;transition:transform .15s,border-color .15s}
.scard:hover{transform:translateY(-2px);border-color:var(--pr)}
.scard .n{font-size:.78rem;font-weight:800;color:var(--pr)}.scard h3{margin:0;font-size:1.02rem}.scard.done{border-color:var(--ok)}
.pill{display:inline-block;font-size:.72rem;font-weight:700;padding:1px 9px;border-radius:10px;background:var(--pl);color:var(--pr)}.pill.ok{background:var(--okb);color:var(--ok)}.pill.w{background:var(--uncb);color:var(--unc)}
.tabs{display:flex;gap:6px;overflow-x:auto;background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:6px;margin-bottom:14px;position:sticky;top:var(--topbar-height,58px);z-index:19}
.tabs a{padding:7px 13px;border-radius:18px;color:var(--mu);font-weight:600;text-decoration:none;white-space:nowrap;font-size:.92rem}
.tabs a.on{background:var(--pl);color:var(--pr)}.tabs a.ck::after{content:" ✓";color:var(--ok)}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:640px;font-size:.92rem}th,td{padding:8px;border-bottom:1px solid var(--bd);text-align:left;vertical-align:top}th{background:var(--pl)}
.ex{padding:10px 0;border-top:1px dashed var(--bd)}.ex .o{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.ex .o button,.opt{border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:7px 13px;border-radius:9px;font:inherit;cursor:pointer}
.ex .o button.right,.opt.right{background:var(--okb);border-color:var(--ok)}.ex .o button.wrong,.opt.wrong{background:var(--badb);border-color:var(--bad)}
.why{margin-top:6px;padding:6px 10px;border-radius:8px;background:var(--badb);font-size:.92rem}
textarea,input[type=text],input[type=number],select{width:100%;padding:9px 11px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit}
textarea{min-height:110px}
.board{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.bcard{background:var(--pl);border:2px solid var(--pr);border-radius:var(--r);padding:12px}
.bcard .L{display:inline-flex;width:34px;height:34px;border-radius:50%;background:var(--pr);color:#fff;font-weight:800;align-items:center;justify-content:center;margin-right:8px}
.bcard h4{display:flex;align-items:center;margin:0 0 6px}
.model{background:var(--okb);border-left:4px solid var(--ok);padding:10px 12px;border-radius:8px;margin:6px 0;display:none}.model.show{display:block}
.pass{font-size:1.1rem;line-height:2}.pass .w{padding:1px 2px;border-radius:5px;cursor:pointer}.pass .w.hl{background:var(--hl);color:#111}
.hint{background:var(--uncb);border-radius:8px;padding:8px 12px;font-size:.92rem}
.warn{background:var(--badb);border:1px solid var(--bad);border-radius:10px;padding:10px 12px;margin-bottom:12px}
.big{font-size:1.4rem;font-weight:800}.center{text-align:center}
.timer{font-size:2rem;font-weight:800;font-variant-numeric:tabular-nums}
.sp{background:none;border:0;cursor:pointer;font-size:1.05rem;padding:2px 4px}
.cloze{font-size:1.2rem}.cloze u{display:inline-block;min-width:90px;border-bottom:3px solid var(--pr);text-decoration:none}
.tile{display:inline-block;border:1px solid var(--pr);background:var(--pl);color:var(--pr);padding:6px 12px;border-radius:9px;margin:3px;cursor:pointer;font:inherit}.tile.used{opacity:.3}
.iframe-wrap{border:1px solid var(--bd);border-radius:var(--r);overflow:hidden;background:#fff}
iframe.lab{width:100%;height:80vh;min-height:560px;border:0;display:block}
.vid{position:relative;padding-bottom:56.25%;height:0;overflow:hidden;border-radius:12px;background:#000}.vid iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
#toast{display:none;position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0));background:#1d2433;color:#fff;padding:10px 16px;border-radius:12px;z-index:60;max-width:92%;text-align:center}
details{border:1px solid var(--bd);border-radius:10px;padding:8px 12px;margin:8px 0;background:var(--card)}summary{cursor:pointer;font-weight:700}
ul.tight{margin:4px 0;padding-left:20px}
footer{text-align:center;padding:26px 16px;color:var(--mu);font-size:.92rem}
@media (max-width:600px){main{padding:10px}.tabs{top:var(--topbar-height,58px)}header.top h1{font-size:1rem}.hero{padding:14px}table{font-size:.85rem}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
#app:focus,#app:focus-visible{outline:none}

.hero .note{color:#fff;opacity:.92}.hero .pill{background:rgba(255,255,255,.25);color:#fff}.hero h2{margin:4px 0}
.tabs a.lock{opacity:.55}


/* ===== colour accents (rose / teal / amber / blue) ===== */
:root{--pk:#db2777;--pkb:#fce7f3;--tl:#0f766e;--tlb:#ccfbf1;--am:#b45309;--amb:#fef3c7;--bl:#1d4ed8;--blb:#dbeafe}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--pk:#f472b6;--pkb:#4a1d36;--tl:#5eead4;--tlb:#123b38;--am:#fbbf24;--amb:#3f2f0c;--bl:#93c5fd;--blb:#1e2f55}}
:root[data-theme="dark"]{--pk:#f472b6;--pkb:#4a1d36;--tl:#5eead4;--tlb:#123b38;--am:#fbbf24;--amb:#3f2f0c;--bl:#93c5fd;--blb:#1e2f55}
section.rich>.card{border-top:4px solid var(--pr)}
section.rich>.card:nth-of-type(4n+2){border-top-color:var(--pk)}
section.rich>.card:nth-of-type(4n+3){border-top-color:var(--tl)}
section.rich>.card:nth-of-type(4n+4){border-top-color:var(--am)}
.rich b,.rich strong{color:var(--pk)}
.rich i,.rich em{color:var(--tl)}
.rich h3{border-left:5px solid var(--pk);padding-left:10px}
.rich h4{color:var(--pr)}
.rich th{background:linear-gradient(135deg,var(--pl),var(--pkb));color:var(--pr)}
.rich td:first-child{font-weight:700;color:var(--pr)}
.rich tbody tr:nth-child(even) td{background:rgba(124,58,237,.06)}
.rich ol>li::marker{font-weight:800;color:var(--pk)}
.rich ol>li:nth-child(4n+1)>b:first-child{color:var(--pr)}
.rich ol>li:nth-child(4n+2)>b:first-child{color:var(--pk)}
.rich ol>li:nth-child(4n+3)>b:first-child{color:var(--tl)}
.rich ol>li:nth-child(4n+4)>b:first-child{color:var(--am)}
.rich .chip,.rich .btn,.rich .hero b,.rich .pill b{color:inherit}
.rich .btn{color:#fff}.rich .btn.s{color:var(--pr)}
.rich .chip b,.rich .tile b{color:inherit}
.rich .ex b,.rich .quiz b{color:inherit}
.rich .hint b{color:var(--am)}
.rich .model b{color:var(--ok)}
.rich .why b{color:var(--bad)}
.rich .bcard h4{color:var(--tx)}
li.kl{list-style:none;border-left:5px solid;border-radius:8px;padding:6px 10px;margin:6px 0}
ul.has-kl{padding-left:0;list-style:none}
.rich li.k-pos{background:var(--okb);border-color:var(--ok)}.rich li.k-pos>b:first-child{color:var(--ok)}
.rich li.k-neg{background:var(--badb);border-color:var(--bad)}.rich li.k-neg>b:first-child{color:var(--bad)}
.rich li.k-q{background:var(--blb);border-color:var(--bl)}.rich li.k-q>b:first-child{color:var(--bl)}
.rich li.k-key{background:var(--amb);border-color:var(--am)}.rich li.k-key>b:first-child{color:var(--am)}
.rich li.k-form{background:var(--pkb);border-color:var(--pk)}.rich li.k-form>b:first-child{color:var(--pk)}
.rich li.k-ex{background:var(--tlb);border-color:var(--tl)}.rich li.k-ex>b:first-child{color:var(--tl)}
.formula{background:linear-gradient(135deg,var(--pkb),var(--pl));border-left:5px solid var(--pk);padding:10px 14px;border-radius:10px;margin:0 0 12px;font-size:1.05rem}
.formula .tag{color:var(--pk)}
.cg{align-items:stretch}
.cgc{border-radius:12px;padding:10px 12px}.cgc>div{margin:3px 0}
.cgc.cpos{background:var(--okb);border:1px solid var(--ok)}.cgc.cpos .tag{color:var(--ok)}
.cgc.cneg{background:var(--badb);border:1px solid var(--bad)}.cgc.cneg .tag{color:var(--bad)}
.cgc.cq{background:var(--blb);border:1px solid var(--bl)}.cgc.cq .tag{color:var(--bl)}
.cgc.cmis{background:var(--amb);border:1px solid var(--am);margin-top:12px}.cgc.cmis .tag{color:var(--am)}
.rich .cgc b{color:var(--tx);background:rgba(255,232,58,.45);border-radius:4px;padding:0 3px}
.tabs a[data-sec=grammar].on{background:var(--pkb);color:var(--pk)}
.tabs a[data-sec=vocab].on{background:var(--tlb);color:var(--tl)}
.tabs a[data-sec=pron].on{background:var(--amb);color:var(--am)}
.tabs a[data-sec=listen].on{background:var(--blb);color:var(--bl)}
.tabs a[data-sec=reading].on{background:var(--okb);color:var(--ok)}
.tabs a[data-sec=speak].on{background:var(--pkb);color:var(--pk)}
.sgrid .scard{border-top:4px solid var(--pr)}
.sgrid .scard:nth-child(4n+2){border-top-color:var(--pk)}
.sgrid .scard:nth-child(4n+3){border-top-color:var(--tl)}
.sgrid .scard:nth-child(4n+4){border-top-color:var(--am)}
/* help (i) and tip boxes (as in the original Shams) */
h2.sech{display:flex;align-items:center;gap:8px;margin:2px 0 8px}
button.i{width:24px;height:24px;border-radius:50%;border:2px solid var(--pr);background:var(--pl);color:var(--pr);font-weight:700;font-size:13px;cursor:pointer;flex:none;padding:0}
.tipbox{display:none;direction:rtl;text-align:right;background:var(--pl);border-right:4px solid var(--pr);padding:10px 12px;border-radius:8px;margin:0 0 12px;font-size:.95rem}
.tipbox.show{display:block}
.stghint{margin:0 0 10px;font-size:.84rem}
.srclink{margin:22px 0 0;font-size:.8rem}
/* lock + instructions */
.lkb{background:rgba(255,255,255,.22);border:0;border-radius:50%;width:34px;height:34px;cursor:pointer;font-size:1rem;color:#fff;vertical-align:middle}
.lkbox{display:inline-flex;align-items:center;gap:6px}
.lkw input{width:84px;padding:5px 8px;font-size:.9rem}
.inst{background:rgba(255,255,255,.14);border-radius:12px;padding:10px 14px;font-size:.88rem;margin-top:12px;line-height:1.55}
.inst .ar{display:block;margin-top:4px}
.inst .btn{margin-top:4px}
/* audio player with yellow word highlight */
.tpbar{background:var(--pl);border-radius:12px;padding:8px 10px;margin:4px 0 8px}
.tpbar .spd{display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap}
.tpbar input[type=range]{width:120px;padding:0}
.tpbar .rv{min-width:2.6em;color:var(--pr)}
.tp .pass .w{transition:background .12s}
.tp .pass .w.hl{background:var(--hl);color:#111;box-shadow:0 0 0 2px var(--hl)}
.tp .pass .w.ok{background:var(--okb);color:var(--ok)}
.tp .pass .w.bad{background:var(--badb);color:var(--bad);font-weight:700}
.tp .tps{font-size:.8rem;opacity:.7;padding:0 3px}
.tp.hide .tpbody{filter:blur(7px);user-select:none}
.yl{background:var(--hl);color:#111;border-radius:4px;padding:0 5px;font-weight:700}
body.in-session header.top #gnav,
body.scroll-down:not(.in-session) header.top #gnav{display:none}
</style>
<style id="soft">
/* calmer, eye-friendly palette */
:root{--pk:#a8567c;--pkb:#f6ecf1;--tl:#3f7f78;--tlb:#e6f2f0;--am:#9a6b2f;--amb:#f6efe2;--bl:#4a6aa8;--blb:#e8eef7;--ok:#4d8a62;--okb:#e5f1ea;--bad:#b25a5a;--badb:#f6e8e8;--unc:#9a6b2f;--uncb:#f6efe2}

:root[data-theme="dark"]{--pk:#d89ab8;--pkb:#3a2a33;--tl:#8cc4bd;--tlb:#213836;--am:#d7b27a;--amb:#3a3224;--bl:#9db4de;--blb:#26304a;--ok:#7cbf93;--okb:#1f3a2b;--bad:#d68a8a;--badb:#3d2727;--unc:#d7b27a;--uncb:#3a3224}
.rich .cgc b{background:rgba(190,165,100,.22)}
.rich b,.rich strong{font-weight:700}
.formula{background:linear-gradient(135deg,var(--pkb),var(--pl))}
.hint{border:1px solid rgba(154,107,47,.18)}
.owner{text-align:center;margin:18px auto 8px;padding:0 12px 4px}.owner img{width:min(720px,100%);height:auto;max-height:none;object-fit:contain;border-radius:16px;display:block;margin:0 auto 12px;box-shadow:0 8px 24px rgba(0,0,0,.12)}.owner p{margin:0;font-weight:700}

<script>
const LEGACY_V=[['S2','genuine','real, honest, not fake','She gave me a genuine smile.','genuine friend','/ˈdʒenjuɪn/','حقيقي / صادق'],
['S2','priority','the most important thing','My family is my first priority.','top priority','/praɪˈɒrəti/','أولوية'],
['S2','routine','the usual way you do things every day','My morning routine is simple.','daily routine','/ruːˈtiːn/','روتين'],
['S2','frequently','often; many times','I frequently visit my grandmother.','very frequently','/ˈfriːkwəntli/','بشكل متكرر'],
['S2','ambitious','wanting to be very successful','The ambitious student studies hard.','highly ambitious','/æmˈbɪʃəs/','طموح'],
['S2','objective','a goal','Our main objective is to win.','main objective','/əbˈdʒektɪv/','هدف'],
['S2','achieve','to reach a goal by hard work','You will achieve your dreams.','achieve a goal','/əˈtʃiːv/','يحقق'],
['S2','leisure','free time','In my leisure time, I read.','leisure time','/ˈleʒər/','وقت الفراغ'],
['S3','unwind','to relax after work','I unwind with a book.','unwind after work','/ʌnˈwaɪnd/','يسترخي'],
['S3','immerse','to be fully involved in something','He immerses himself in music.','immerse yourself in','/ɪˈmɜːrs/','ينغمس'],
['S3','passionate','having very strong feelings for something','She is passionate about art.','passionate about','/ˈpæʃənət/','شغوف'],
['S3','pursue','to follow an activity or plan over time','I want to pursue a career in design.','pursue a hobby','/pərˈsuː/','يسعى وراء'],
['S3','rewarding','giving you satisfaction','Teaching is a rewarding job.','highly rewarding','/rɪˈwɔːrdɪŋ/','مُجزٍ / مُرضٍ'],
['S3','amusing','funny and entertaining','It was an amusing story.','amusing story','/əˈmjuːzɪŋ/','مسلٍّ'],
['S3','fascinating','extremely interesting','The film was fascinating.','fascinating topic','/ˈfæsɪneɪtɪŋ/','مذهل / ساحر'],
['S3','dedicate','to give time or effort to something','I dedicate an hour to English.','dedicate time','/ˈdedɪkeɪt/','يُكرّس'],
['S3','recreation','activities for enjoyment','The park is for public recreation.','recreation centre','/ˌrekriˈeɪʃn/','ترفيه'],
['Chunk','to be completely honest…','opening to give a true opinion','To be completely honest, I prefer tea.','—','/tə bi kəmˈpliːtli ˈɒnɪst/','بصراحة تامة…'],
['Chunk','I’m keen on…','I like something a lot','I’m keen on tennis.','keen on sports','/aɪm kiːn ɒn/','أنا متحمس لـ…'],

const isObj=o=>o&&typeof o==='object'&&!Array.isArray(o);
function sane(o){
  const d=defState();if(!isObj(o))return d;
  for(const k of Object.keys(d)){
    if(o[k]===undefined)continue;
    if(d[k]===null){if(o[k]===null||isObj(o[k]))d[k]=o[k]}
    else if(Array.isArray(d[k])){if(Array.isArray(o[k]))d[k]=o[k]}
    else if(isObj(d[k])){if(isObj(o[k]))d[k]=Object.assign(d[k],o[k])}
    else if(typeof o[k]===typeof d[k])d[k]=o[k];
  }
  if(!isObj(d.srs.items))d.srs.items={};
  if(!Array.isArray(d.srs.history))d.srs.history=[];
  if(!Array.isArray(d.unlockedSessions))d.unlockedSessions=[];
  for(const [id,it] of Object.entries(d.srs.items)){ // drop malformed review items
    if(!isObj(it)||typeof it.term!=='string'||!Number.isInteger(it.reviewLevel)||it.reviewLevel<0||it.reviewLevel>5)delete d.srs.items[id];
  }
  ['speak','video','topics'].forEach(k=>{if(!isObj(d[k]))d[k]=defState()[k]});
  if(!isObj(d.speak.done))d.speak.done={};if(!isObj(d.speak.texts))d.speak.texts={};

}

/* similarity helpers */
const lev=(a,b)=>{const d=Array.from({length:a.length+1},(_,i)=>[i,...Array(b.length).fill(0)]);for(let j=1;j<=b.length;j++)d[0][j]=j;for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[a.length][b.length]};
const sim=(a,b)=>1-lev(a,b)/Math.max(a.length,b.length,1);
const normT=s=>String(s).toLowerCase().replace(/[’]/g,"'").replace(/[^a-z0-9' ]/g,' ').replace(/\s+/g,' ').trim();
/** LCS-based read-aloud alignment: returns {pct, missed[]} */
function readScore(ref,heard){
  const R=normT(ref).split(' ').filter(Boolean),H=normT(heard).split(' ').filter(Boolean);
  const n=R.length,m=H.length,D=Array.from({length:n+1},()=>Array(m+1).fill(0));
  for(let i=1;i<=n;i++)for(let j=1;j<=m;j++)D[i][j]=R[i-1]===H[j-1]?D[i-1][j-1]+1:Math.max(D[i-1][j],D[i][j-1]);
  const hit=new Set();let i=n,j=m;
  while(i>0&&j>0){if(R[i-1]===H[j-1]){hit.add(i-1);i--;j--}else if(D[i-1][j]>=D[i][j-1])i--;else j--}
  return{pct:n?Math.round(hit.size/n*100):0,missed:R.filter((w,k)=>!hit.has(k)),n};
}

/** wraps every word of a .tp box in a span and groups the words into sentences */
function tpWrap(box){
  const id=box.dataset.tid,words=[],sents=[];
  const walk=n=>{
    if(n.nodeType===3){
      const frag=document.createDocumentFragment();
      n.nodeValue.split(/(\s+)/).forEach(p=>{
        if(!p)return;
        if(/^\s+$/.test(p)){frag.appendChild(document.createTextNode(p));return}
        const sp=document.createElement('span');sp.className='w';sp.dataset.i=words.length;sp.textContent=p;words.push(sp);frag.appendChild(sp);
      });
      n.parentNode.replaceChild(frag,n);
    }else if(n.nodeType===1&&!/^(BUTTON|A|TEXTAREA|INPUT)$/.test(n.tagName)){[...n.childNodes].forEach(walk)}
  };

    const start=words.length;walk(p);
    let cur=[];
    for(let i=start;i<words.length;i++){cur.push(i);if(/[.!?…]["'”’)\]]*$/.test(words[i].textContent)){sents.push(cur);cur=[]}}
    if(cur.length)sents.push(cur);

}

  Object.values(TPS).forEach(o=>{if(o!==T&&(o.playing||o.running))tpStop(o)});

  clearTimeout(T.tm);T.tok++;const tok=T.tok;T.si=si;T.running=!!chain;T.playing=true;T.paused=false;T.gotB=false;
  const pb=T.box.querySelector('[data-tp=pause]');if(pb)pb.textContent='⏸ Pause';

}

/** which reference words were matched (LCS alignment) */
function lcsHits(R,H){
  const n=R.length,m=H.length,D=Array.from({length:n+1},()=>Array(m+1).fill(0));
  for(let i=1;i<=n;i++)for(let j=1;j<=m;j++)D[i][j]=R[i-1]===H[j-1]?D[i-1][j-1]+1:Math.max(D[i-1][j],D[i][j-1]);
  const hit=new Set();let i=n,j=m;
  while(i>0&&j>0){if(R[i-1]===H[j-1]){hit.add(i-1);i--;j--}else if(D[i-1][j]>=D[i][j-1])i--;else j--}
  return hit;
}
document.addEventListener('click',e=>{
  const r=e.target.closest('[data-rec]');

  const c=e.target.closest('[data-score]');
  if(c){const id=c.dataset.score,card=c.closest('[data-ra]'),spans=$$('.pass .w',card),heard=document.getElementById(id+'-t').value,out=document.getElementById(id+'-r');
    if(!heard.trim()){out.textContent='Record yourself (or type what you read) first.';return}
    const flat=[],own=[];spans.forEach((sp,k)=>normT(sp.textContent).split(' ').filter(Boolean).forEach(t=>{flat.push(t);own.push(k)}));
    const hits=lcsHits(flat,normT(heard).split(' ').filter(Boolean)),okSp=new Set(),badSp=new Set();
    own.forEach((k,j)=>{(hits.has(j)?okSp:badSp).add(k)});
    spans.forEach((sp,k)=>{sp.classList.remove('ok','bad');if(badSp.has(k))sp.classList.add('bad');else if(okSp.has(k))sp.classList.add('ok')});
    const n=flat.length,pct=n?Math.round(hits.size/n*100):0,missed=[...new Set(flat.filter((t,j)=>!hits.has(j)))];
    out.innerHTML=`<b>${pct}%</b> of the words matched. ${pct>=75?'✅ Great reading!':'Try again, slowly.'} <span class="note">Green = matched · red = missed or unclear (tap a word to hear it).</span>${missed.length?`<br>Missed or unclear: ${missed.slice(0,25).map(esc).join(', ')}`:''}`}
});

/** colour-code grammar labels (Positive / Negative / Question / Keywords / Form …) */
function colorize(root){
  if(!root)return;
  $$('li,p',root).forEach(el=>{
    const b=el.firstElementChild;if(!b||b.tagName!=='B')return;
    if(el.firstChild!==b&&(el.firstChild.textContent||'').trim())return;
    const t=b.textContent.toLowerCase().trim();let c='';
    if(/^(positive|affirmative)/.test(t))c='k-pos';
    else if(/^negative/.test(t))c='k-neg';
    else if(/^(question|interrogative)/.test(t))c='k-q';
    else if(/^(key ?words?|signal|time expressions?)/.test(t))c='k-key';
    else if(/^(use ?\d|use:|rule|form\b|structure|formula)/.test(t))c='k-form';
    else if(/^(example|e\.g)/.test(t))c='k-ex';
    if(c&&el.tagName==='LI'){el.classList.add('kl',c);el.parentElement.classList.add('has-kl')}
  });
}

function vocabQuizItems(s){
  const words=s.vocabulary||[];
  return words.slice(0,Math.min(10,words.length)).map((v,i)=>{
    const wrong=[];
    for(let step=1;step<words.length&&wrong.length<3;step++){
      const candidate=words[(i+step)%words.length].meaning;
      if(candidate&&candidate!==v.meaning&&!wrong.includes(candidate))wrong.push(candidate);
    }
    const opts=[v.meaning,...wrong].slice(0,4),shift=i%opts.length,rot=opts.slice(shift).concat(opts.slice(0,shift));
    return [`What does “${v.term}” mean?`,rot,rot.indexOf(v.meaning),`“${v.term}” means: ${v.meaning}`];
  });
}

/* =====================================================================
   SPACED-REPETITION ENGINE (Forgetting Curve: reviews at Day 1, 3, 7, 14, 30)
   ===================================================================== */
const REVIEW_INTERVALS=[0,1,3,7,14,30];   // Day 0 = learning; then Review 1..5. Do not change.

/* Item model (stored in S.srs.items[id]):
   {id, term, meaning, example, collocation, sessionId, alsoIn[], learnedAt, anchor, reviewLevel(0-5),
    nextReviewAt, status:'learning'|'reviewing'|'relearning'|'mastered', correct, wrong, lapses}
   `anchor` is the date that Day 0 of the curve is measured from. It equals learnedAt until an item is
   forgotten; then it moves so the item restarts one step lower on the curve. */

/** Register vocabulary (a session object or an array of vocabulary items). Duplicates (same term) are skipped. */
function srsAdd(src){
  const list=Array.isArray(src)?src:src.vocabulary.map(v=>Object.assign({},v,{sessionId:src.id}));
  const t=today();let n=0;
  list.forEach(v=>{
    const id=slug(v.term);if(!id)return;
    const ex=S.srs.items[id];
    if(ex){if(v.sessionId!==ex.sessionId&&!(ex.alsoIn||[]).includes(v.sessionId)){ex.alsoIn=ex.alsoIn||[];ex.alsoIn.push(v.sessionId)}return}
    S.srs.items[id]={id,term:v.term,meaning:v.meaning,example:v.example,collocation:v.collocation||'',sessionId:v.sessionId,alsoIn:[],
      learnedAt:t,anchor:t,reviewLevel:0,nextReviewAt:addDays(t,REVIEW_INTERVALS[1]),status:'learning',correct:0,wrong:0,lapses:0};
    n++;
  });
  save();return n;
}
const srsItems=()=>Object.values(S.srs.items);
function srsDue(){const t=today();return srsItems().filter(i=>i.status!=='mastered'&&i.nextReviewAt&&i.nextReviewAt<=t).sort((a,b)=>a.nextReviewAt<b.nextReviewAt?-1:1)}
const srsDueCount=()=>{try{return srsDue().length}catch(e){return 0}};

/** Record an answer. First attempt of a due item moves it along the curve; extra practice only logs. */
function srsGrade(id,correct,type,noSchedule){
  const it=S.srs.items[id];if(!it)return;
  const t=today();
  S.srs.history.push({t:nowDate().toISOString(),d:t,id,type,ok:!!correct,lv:it.reviewLevel,p:noSchedule?1:0});
  if(S.srs.history.length>3000)S.srs.history=S.srs.history.slice(-3000);
  if(noSchedule){save();return}
  if(correct){
    it.correct++;it.reviewLevel=Math.min(5,it.reviewLevel+1);
    if(it.reviewLevel>=5){it.status='mastered';it.nextReviewAt=null}
    else{let nx=addDays(it.anchor,REVIEW_INTERVALS[it.reviewLevel+1]);if(nx<=t)nx=addDays(t,1);it.nextReviewAt=nx;it.status='reviewing'}
  }else{
    it.wrong++;it.lapses++;it.reviewLevel=Math.max(0,it.reviewLevel-1);
    it.anchor=addDays(t,-REVIEW_INTERVALS[it.reviewLevel]);
    it.nextReviewAt=addDays(it.anchor,REVIEW_INTERVALS[it.reviewLevel+1]);it.status='relearning';
  }
  save();
}
function srsStats(){
  const items=srsItems(),since=addDays(today(),-30),h=S.srs.history.filter(x=>!x.p&&x.d>=since),ok=h.filter(x=>x.ok).length;
  const levels=[0,1,2,3,4,5].map(l=>items.filter(i=>i.reviewLevel===l&&i.status!=='mastered').length);
  const upcoming={};items.forEach(i=>{if(i.nextReviewAt)upcoming[i.nextReviewAt]=(upcoming[i.nextReviewAt]||0)+1});
  return{total:items.length,due:srsDueCount(),mastered:items.filter(i=>i.status==='mastered').length,relearning:items.filter(i=>i.status==='relearning').length,
    retention:h.length?Math.round(ok/h.length*100):null,answered:h.length,levels,upcoming};

/* ---------- exercise generation ---------- */
const reEsc=s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
/** Replace the target term inside its example with a blank. Returns {text, answer} or null. */
function blankIn(example,term){
  if(!example)return null;
  const ex=example.replace(/’/g,"'"),t=term.replace(/…/g,'').replace(/’/g,"'").trim();if(!t)return null;
  const tries=[reEsc(t)];
  const w=t.split(/\s+/);
  if(w[0].length>=5){const stem=w[0].replace(/(e|y|es|s)$/i,'');tries.push(reEsc(stem)+'[a-z]*'+(w.length>1?'\\s+'+w.slice(1).map(reEsc).join('\\s+'):''))}
  for(const pat of tries){
    const re=new RegExp('(^|[^A-Za-z])('+pat+')(?![A-Za-z])','i'),m=ex.match(re);
    if(m)return{text:ex.replace(re,(a,p)=>p+'_____'),answer:m[2]};
  }
  return null;
}
function termPool(){
  const m=new Map();
  srsItems().forEach(i=>m.set(i.id,i));
  SESSIONS.forEach(s=>s.vocabulary.forEach(v=>{const id=slug(v.term);if(!m.has(id))m.set(id,{id,term:v.term,meaning:v.meaning,example:v.example,sessionId:s.id})}));
  return[...m.values()];
}
function distractors(it,n,field){
  const pool=termPool().filter(x=>x.id!==it.id&&x[field]&&slug(x[field])!==slug(it[field]));
  const same=shuffle(pool.filter(x=>x.sessionId===it.sessionId)),rest=shuffle(pool.filter(x=>x.sessionId!==it.sessionId));
  return[...same,...rest].slice(0,n).map(x=>x[field]);
}
const LEVEL_TYPES={0:['mc','complete'],1:['recall','mc'],2:['complete','missing'],3:['missing','chunk'],4:['chunk','speak'],5:['active','speak']};
const TYPE_LABEL={mc:'Multiple choice',recall:'Meaning recall',complete:'Sentence completion',missing:'Missing word',chunk:'Chunk usage',speak:'Speaking with target vocabulary',active:'Active recall'};
function chooseType(it,attempt){
  const list=LEVEL_TYPES[it.reviewLevel]||LEVEL_TYPES[0];let t=list[attempt%list.length];
  const b=blankIn(it.example,it.term);
  if((t==='complete'||t==='missing')&&!b)t='mc';
  if(t==='chunk'&&(!it.example||it.example.trim().split(/\s+/).length<4))t=b?'missing':'mc';
  return t;
}

/* ---------- review runner ---------- */
let RUN=null;
function runStart(items,opts){
  RUN={queue:shuffle(items.map(i=>i.id)),again:[],attempts:{},first:{},answered:0,total:items.length,practice:!!opts.practice,title:opts.title||'Review',log:[],cur:null,locked:false};
  runNext();
}
function runNext(){
  if(!RUN)return;
  if(!RUN.queue.length&&RUN.again.length){RUN.queue=shuffle(RUN.again);RUN.again=[]}
  if(!RUN.queue.length){runSummary();return}
  const id=RUN.queue.shift(),it=S.srs.items[id]||termPool().find(x=>x.id===id);
  const lvItem=S.srs.items[id]||Object.assign({reviewLevel:0},it);
  const att=RUN.attempts[id]||0,type=att>0&&att%2===1?'mc':chooseType(lvItem,att);
  RUN.cur={id,it:lvItem,type,att};RUN.locked=false;runRender();
}
function runRender(){
  const c=RUN.cur,it=c.it,left=RUN.queue.length+RUN.again.length+1,app=$('#rv');
  const head=`<div class="row" style="justify-content:space-between"><span class="pill">${TYPE_LABEL[c.type]}</span><span class="note">${esc(RUN.title)} · ${left} left${c.att?' · extra practice':''}</span></div><div class="bar"><i style="width:${Math.round(RUN.answered/Math.max(RUN.total,1)*100)}%"></i></div>`;
  let body='';
  const b=blankIn(it.example,it.term);
  if(c.type==='mc'){
    const opts=shuffle([it.meaning,...distractors(it,3,'meaning')]);c.opts=opts;
    body=`<h3>What does <b>${esc(it.term)}</b> mean? ${sayBtn(it.term.replace('…',''))}</h3><div class="col">${opts.map((o,i)=>`<button class="opt" data-o="${i}" style="display:block;width:100%;text-align:left;margin:6px 0">${esc(o)}</button>`).join('')}</div>`;
  }else if(c.type==='recall'){
    body=`<h3>Meaning recall</h3><p class="cloze">“${esc(it.meaning)}”</p><p class="note">Type the English word or chunk that has this meaning.${it.collocation&&it.collocation!=='—'?` Hint: used like “${esc(it.collocation)}”.`:''}</p><input type="text" id="ans" autocomplete="off" aria-label="Your answer"><div class="row"><button class="btn" id="chk">Check</button></div>`;
  }else if(c.type==='complete'){
    const opts=shuffle([b.answer,...distractors(it,3,'term').map(t=>t.replace('…',''))]);c.opts=opts;
    body=`<h3>Sentence completion</h3><p class="cloze">${esc(b.text).replace('_____','<u>&nbsp;</u>')}</p><div>${opts.map((o,i)=>`<button class="opt" data-o="${i}" style="margin:4px">${esc(o)}</button>`).join('')}</div>`;
  }else if(c.type==='missing'){
    c.answer=b.answer;
    body=`<h3>Missing word</h3><p class="cloze">${esc(b.text).replace('_____','<u>&nbsp;</u>')}</p><p class="note">Hint: starts with “${esc(b.answer[0])}”, ${b.answer.replace(/\s/g,'').length} letters${/\s/.test(b.answer)?' (a chunk of '+b.answer.split(/\s+/).length+' words)':''}.</p><input type="text" id="ans" autocomplete="off" aria-label="Missing word"><div class="row"><button class="btn" id="chk">Check</button></div>`;
  }else if(c.type==='chunk'){
    const words=it.example.trim().split(/\s+/);c.words=words;c.pos=[];
    body=`<h3>Chunk usage — build the sentence</h3><p class="note">Put the words in order. It uses <b>${esc(it.term)}</b>.</p><p class="cloze" id="built" style="min-height:2.4em"></p><div id="tiles">${shuffle(words.map((w,i)=>[w,i])).map(([w,i])=>`<button class="tile" data-i="${i}">${esc(w)}</button>`).join('')}</div><div class="row"><button class="btn s" id="rst">Reset</button><button class="btn" id="chk">Check</button></div>`;
  }else if(c.type==='speak'){
    body=`<h3>Speaking with target vocabulary</h3><p>Say <b>one sentence</b> using <b>“${esc(it.term)}”</b> ${sayBtn(it.term.replace('…',''))}</p><p class="note">Meaning: ${esc(it.meaning)}</p>
    <div class="row"><button class="btn" id="mic">🎤 Speak</button><span class="note" id="ms"></span></div><textarea id="ans" style="min-height:60px" placeholder="…or type your sentence here" aria-label="Your sentence"></textarea>
    <div class="row"><button class="btn" id="chk">Check my sentence</button><button class="btn s" id="self">I said it aloud ✔</button><button class="btn s" id="cant">I couldn’t</button></div>`;
  }else{ // active recall
    body=`<h3>Active recall</h3><p class="cloze"><b>${esc(it.term)}</b> ${sayBtn(it.term.replace('…',''))}</p><p class="note">Don’t look anything up. Say or write the meaning and a sentence from memory. Then reveal the answer and grade yourself honestly.</p>
    <textarea id="ans" style="min-height:70px" aria-label="From memory"></textarea><div class="row"><button class="btn s" id="amic">🎤</button><button class="btn" id="rev">Reveal answer</button></div><div id="revbox" style="display:none"><div class="model show"><b>Meaning:</b> ${esc(it.meaning)}<br><b>Example:</b> ${esc(it.example)}${it.collocation&&it.collocation!=='—'?`<br><b>Collocation:</b> ${esc(it.collocation)}`:''}</div><div class="row"><button class="btn" id="gok">✅ I remembered</button><button class="btn d" id="gno">❌ I forgot</button></div></div>`;
  }
  app.innerHTML=`<div class="card">${head}<div id="q" style="margin-top:12px">${body}</div><div id="fbk" role="status"></div></div>`;
  runBind();
}
function runBind(){
  const c=RUN.cur,it=c.it,q=$('#q'),b=blankIn(it.example,it.term);
  const ans=()=>($('#ans')?$('#ans').value:'');
  if(c.type==='mc'||c.type==='complete'){
    $$('.opt',q).forEach(btn=>btn.onclick=()=>{if(RUN.locked)return;const v=c.opts[+btn.dataset.o],ok=c.type==='mc'?v===it.meaning:normT(v)===normT(b.answer);btn.classList.add(ok?'right':'wrong');runDone(ok,c.type==='mc'?it.meaning:b.answer)});
  }else if(c.type==='recall'||c.type==='missing'){
    const f=()=>{if(RUN.locked)return;const a=normT(ans());if(!a)return;const t=normT(c.type==='missing'?c.answer:it.term);const ok=a===t||(t.length>=6&&!/\s/.test(t)&&sim(a,t)>=.88);runDone(ok,c.type==='missing'?c.answer:it.term)};
    $('#chk').onclick=f;$('#ans').onkeydown=e=>{if(e.key==='Enter')f()};$('#ans').focus();
  }else if(c.type==='chunk'){
    const upd=()=>{$('#built').textContent=c.pos.map(i=>c.words[i]).join(' ');$$('#tiles .tile').forEach(t=>t.classList.toggle('used',c.pos.includes(+t.dataset.i)))};
    $$('#tiles .tile').forEach(t=>t.onclick=()=>{if(RUN.locked||c.pos.includes(+t.dataset.i))return;c.pos.push(+t.dataset.i);upd()});
    $('#rst').onclick=()=>{if(RUN.locked)return;c.pos=[];upd()};
    $('#chk').onclick=()=>{if(RUN.locked||c.pos.length!==c.words.length)return;runDone(normT(c.pos.map(i=>c.words[i]).join(' '))===normT(it.example),it.example)};
  }else if(c.type==='speak'){
    const t=normT(it.term.replace('…','')),stem=t.split(' ')[0].length>=5?t.split(' ')[0].replace(/(e|y|es|s)$/,''):null;
    const has=s=>{const n=normT(s);return n.includes(t)||(stem&&new RegExp('\\b'+reEsc(stem)).test(n)&&t.split(' ').slice(1).every(w=>n.includes(w)))};
    $('#mic').onclick=()=>once(alts=>{const a=alts.find(has)||alts[0];$('#ans').value=a;$('#ms').textContent='';if(RUN.locked)return;runDone(has(a)&&wc(a)>=4,it.example,has(a)&&wc(a)<4?'Say a full sentence (4+ words).':'')},m=>{$('#ms').textContent=m});
    $('#chk').onclick=()=>{if(RUN.locked)return;const a=ans();if(!a.trim())return;runDone(has(a)&&wc(a)>=4,it.example,!has(a)?'Use the target word or chunk in your sentence.':'Say a full sentence (4+ words).')};
    $('#self').onclick=()=>{if(!RUN.locked)runDone(true,it.example)};$('#cant').onclick=()=>{if(!RUN.locked)runDone(false,it.example)};
  }else{
    $('#amic').onclick=()=>dictate($('#amic'),$('#ans'));
    $('#rev').onclick=()=>{$('#revbox').style.display='block';$('#rev').disabled=true};
    $('#gok').onclick=()=>{if(!RUN.locked)runDone(true,it.meaning)};$('#gno').onclick=()=>{if(!RUN.locked)runDone(false,it.meaning)};
  }
}
function runDone(ok,answer,why){
  const c=RUN.cur;RUN.locked=true;
  const first=!(c.id in RUN.first);
  if(first){RUN.first[c.id]=ok;RUN.answered++}
  RUN.attempts[c.id]=(RUN.attempts[c.id]||0)+1;
  if(S.srs.items[c.id])srsGrade(c.id,ok,c.type,RUN.practice||!first);
  RUN.log.push({id:c.id,ok,first});
  if(!ok)RUN.again.push(c.id);
  const it=S.srs.items[c.id];
  $('#fbk').innerHTML=`<div class="${ok?'model show':'why'}" style="margin-top:12px">${ok?'✅ <b>Correct!</b>':'❌ <b>Not yet.</b> '+(why?esc(why)+' ':'')+'Answer: <b>'+esc(answer)+'</b>. This item will come back for extra practice.'}${first&&it&&!RUN.practice?`<br><span class="note">Next review: ${it.status==='mastered'?'none — mastered 🎉':it.nextReviewAt}</span>`:''}</div><div class="row"><button class="btn" id="nx" autofocus>Next →</button></div>`;

}
function runSummary(){

const PLAN_BLOCKS=[['🧠 Review Today (spaced repetition)',.2],['📘 New grammar or vocabulary',.25],['🗣️ Speaking practice',.3],['🎧 Listening / pronunciation',.15],['📝 Mistake log & wrap-up',.1]];
function planFor(min){
  const raw=PLAN_BLOCKS.map(b=>Math.max(1,Math.round(min*b[1])));let diff=min-raw.reduce((a,b)=>a+b,0);raw[2]+=diff;return raw;
}

function chunkTerms(){const all=[];SESSIONS.forEach(s=>s.vocabulary.forEach(v=>{if(/\s/.test(v.term.trim()))all.push(v.term.replace(/…/g,'').trim())}));return all}
const CHALLENGES=[

function chHTML(c){
  const key='ch:'+c.id,t=S.speak.texts[key]||'';
  return `<div class="card" id="c-${c.id}"><h3>${c.t} ${S.speak.done[key+':ok']?'<span class="pill ok">✓ done</span>':''}</h3><p class="cl-pre note">${c.pre||'Prompt:'}</p><p class="cloze cl-prompt" aria-live="polite"><b>${esc(S.speak.texts[key+':p']||'Press “New prompt”')}</b></p>
  <div class="row"><button class="btn s" data-ch-new="${c.id}">🎲 New prompt</button><button class="btn" data-ch-start="${c.id}">▶ Start ${c.secs}s</button><span class="timer" id="tm-${c.id}">${c.secs}</span></div>
  <textarea id="${key}" data-chkey="${key}" aria-label="Your answer" placeholder="Speak with 🎤 (or type) and your words appear here…">${esc(t)}</textarea>
  <div class="row"><button class="btn s" data-dict="${key}">🎤</button><span class="note" id="${key}-n">${wc(t)} words (aim for ${c.min}+)</span></div>
  ${c.five?`<div id="${key}-five" class="note"></div>`:''}${c.chk.map((x,i)=>`<label style="display:block"><input type="checkbox" data-chchk="${key}:c${i}" ${S.speak.done[key+':c'+i]?'checked':''}> ${x}</label>`).join('')}
  <div class="row"><button class="btn" data-ch-done="${c.id}">✅ Finish challenge</button><span class="note" id="${key}-s"></span></div></div>`;
}
const chTimers={};
function chBind(c){onLeave(()=>{clearInterval(chTimers[c.id])})}
function chFiveUpdate(c){
  if(!c.five)return;const key='ch:'+c.id,p=S.speak.texts[key+':p']||'',el=document.getElementById(key+'-five');if(!el)return;
  const chunks=p.split(' | ').filter(Boolean),txt=normT($('#'+CSS.escape(key)).value);
  const used=chunks.filter(x=>txt.includes(normT(x)));
  el.innerHTML=chunks.map(x=>`<span class="chip ${used.includes(x)?'used':''}">${esc(x)}</span>`).join('')+` <b>${used.length}/${chunks.length}</b> used`;
}
document.addEventListener('click',e=>{
  const nw=e.target.closest('[data-ch-new]');
  if(nw){const c=CHALLENGES.find(x=>x.id===nw.dataset.chNew),key='ch:'+c.id,p=c.gen();S.speak.texts[key+':p']=p;save();$('#c-'+c.id+' .cl-prompt').innerHTML='<b>'+esc(p)+'</b>';chFiveUpdate(c);return}
  const st=e.target.closest('[data-ch-start]');
  if(st){const c=CHALLENGES.find(x=>x.id===st.dataset.chStart),key='ch:'+c.id;
    if(!S.speak.texts[key+':p']){toast('Press “New prompt” first.');return}
    clearInterval(chTimers[c.id]);let n=c.secs;const el=document.getElementById('tm-'+c.id);el.textContent=n;
    chTimers[c.id]=setInterval(()=>{n--;el.textContent=n;if(n<=0){clearInterval(chTimers[c.id]);toast('⏰ Time! Finish your sentence.')}},1000);return}
  const dn=e.target.closest('[data-ch-done]');
  if(dn){const c=CHALLENGES.find(x=>x.id===dn.dataset.chDone),key='ch:'+c.id,n=wc($('#'+CSS.escape(key)).value),all=$$(`[data-chchk^="${key}:"]`).every(x=>x.checked),out=document.getElementById(key+'-s');
    if(!S.speak.texts[key+':p']){out.textContent='Get a prompt first.';return}
    if(n<c.min){out.textContent=`Speak or write at least ${c.min} words (you have ${n}).`;return}
    if(!all){out.textContent='Tick every checklist item you really did.';return}
    S.speak.done[key+':ok']=1;save();clearInterval(chTimers[c.id]);toast('✅ Challenge complete!');out.textContent='✅ Complete — well done!'}
});
document.addEventListener('input',e=>{
  const t=e.target;if(t.matches('textarea[data-chkey]')){const c=CHALLENGES.find(x=>'ch:'+x.id===t.dataset.chkey);S.speak.texts[t.dataset.chkey]=t.value;saveSoon();const n=document.getElementById(t.dataset.chkey+'-n');if(n)n.textContent=wc(t.value)+' words (aim for '+c.min+'+)';chFiveUpdate(c)}
});

function allTopicCats(){const out=[];Object.entries(TOPICS).forEach(([g,cats])=>Object.keys(cats).forEach(c=>out.push([g,c])));return out}
let topicRecent=[];
function genTopic(filter){
  let cats=allTopicCats();
  if(filter&&filter!=='all'){cats=cats.filter(([g,c])=>filter===g||filter===g+'::'+c)}
  if(!cats.length)cats=allTopicCats();
  let tries=0,res;
  do{
    const [g,c]=pick(cats),d=TOPICS[g][c],sc=pick(d.s),isCS=g.startsWith('Customer');
    res={id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),group:g,cat:c,title:sc[0],scenario:sc[1],
      questions:shuffle(d.q).slice(0,Math.min(5,Math.max(3,d.q.length-1))),vocab:shuffle(d.v).slice(0,6),chunks:shuffle(d.c).slice(0,4),challenge:pick(d.ch),
      roles:isCS?{a:'Person A = Customer',b:'Person B = Customer Service Representative',cust:sc[2],csr:sc[3]}:(d.roles?{a:'Person A = Speaker 1',b:'Person B = Speaker 2'}:null)};
    tries++;
  }while(topicRecent.includes(res.title)&&tries<12);
  topicRecent.push(res.title);if(topicRecent.length>8)topicRecent.shift();
  return res;
}
function topicText(t){
  return `${t.title} (${t.cat})\n\nScenario:\n${t.scenario}\n\nDiscussion questions:\n${t.questions.map((q,i)=>(i+1)+'. '+q).join('\n')}\n\nUseful vocabulary:\n${t.vocab.map(v=>'- '+v[0]+': '+v[1]).join('\n')}\n\nCommon English chunks:\n${t.chunks.map(c=>'- '+c).join('\n')}\n\nSpeaking challenge:\n${t.challenge}${t.roles?`\n\nSuggested roles:\n${t.roles.a}${t.roles.cust?' — '+t.roles.cust:''}\n${t.roles.b}${t.roles.csr?' — '+t.roles.csr:''}`:''}`;
}
function topicHTML(t,saved){
  return `<div class="card" ${saved?'':'id="tcard"'}><span class="pill">${esc(t.group)}</span> <span class="pill">${esc(t.cat)}</span><h2 style="margin:6px 0">${esc(t.title)}</h2>
  <h4>📖 Scenario</h4><p>${esc(t.scenario)}</p>
  <h4>❓ Discussion questions</h4><ol>${t.questions.map(q=>`<li>${esc(q)}</li>`).join('')}</ol>
  <h4>📚 Useful vocabulary</h4><div>${t.vocab.map(v=>`<button class="chip" data-say="${esc(v[0])}" title="${esc(v[1])}">🔊 ${esc(v[0])} — <span class="note">${esc(v[1])}</span></button>`).join('')}</div>
  <h4>🧩 Common English chunks</h4><div>${t.chunks.map(c=>`<button class="chip" data-say="${esc(c.replace('…',''))}">🔊 ${esc(c)}</button>`).join('')}</div>
  <h4>🎤 Speaking challenge</h4><p class="hint">${esc(t.challenge)}</p>
  ${t.roles?`<h4>🎭 Suggested roles</h4><div class="g"><div class="bcard"><b>${esc(t.roles.a)}</b>${t.roles.cust?`<p>${esc(t.roles.cust)}</p>`:''}</div><div class="bcard"><b>${esc(t.roles.b)}</b>${t.roles.csr?`<p>${esc(t.roles.csr)}</p>`:''}</div></div>`:''}
  ${saved?`<div class="row"><button class="btn s" data-tshow="${t.id}">Open</button><button class="btn d sm" data-tdel="${t.id}">Remove</button></div>`:''}</div>`;
}
let CUR_TOPIC=null;
ROUTES.topics=app=>{
  const opts=`<option value="all">All topics</option>`+Object.entries(TOPICS).map(([g,cats])=>`<optgroup label="${esc(g)}"><option value="${esc(g)}">All ${esc(g)}</option>${Object.keys(cats).map(c=>`<option value="${esc(g+'::'+c)}">${esc(c)}</option>`).join('')}</optgroup>`).join('');
  app.innerHTML=`<h2>🎲 Choose a Subject — Speak with Your Friends</h2><div class="card stg"><p>Pick a category (or leave it on “All”), generate a topic, and talk for 2–5 minutes with a partner. Customer-service topics are role-plays: <b>Person A = Customer</b>, <b>Person B = Customer Service Representative</b>. <span class="ar note">اختر موضوعًا وتكلّم مع صديقك.</span></p></div>
  <div class="row"><label>Category <select id="tf" style="width:auto;min-width:220px">${opts}</select></label><button class="btn" id="tg">🎲 Generate Another Topic</button><button class="btn s" id="tc">📋 Copy Topic</button><button class="btn s" id="ts">⭐ Save Topic</button></div>
  <div id="tout" aria-live="polite"></div><h3>⭐ Saved topics (${S.topics.saved.length})</h3><div id="tsaved">${S.topics.saved.map(t=>topicHTML(t,true)).join('')||'<p class="note">Nothing saved yet.</p>'}</div>`;
  const show=t=>{CUR_TOPIC=t;$('#tout').innerHTML=topicHTML(t,false)};
  $('#tg').onclick=()=>show(genTopic($('#tf').value));
  $('#tc').onclick=async()=>{if(!CUR_TOPIC){toast('Generate a topic first.');return}const tx=topicText(CUR_TOPIC);try{await navigator.clipboard.writeText(tx);toast('📋 Topic copied!')}catch(e){const ta=document.createElement('textarea');ta.value=tx;document.body.appendChild(ta);ta.select();let ok=false;try{ok=document.execCommand('copy')}catch(x){}ta.remove();toast(ok?'📋 Topic copied!':'Could not copy automatically.')}};
  $('#ts').onclick=()=>{if(!CUR_TOPIC){toast('Generate a topic first.');return}if(S.topics.saved.some(t=>t.id===CUR_TOPIC.id)){toast('Already saved.');return}S.topics.saved.unshift(CUR_TOPIC);if(S.topics.saved.length>50)S.topics.saved.pop();save();toast('⭐ Topic saved');render()};
  $('#tsaved').onclick=e=>{const d=e.target.closest('[data-tdel]'),o=e.target.closest('[data-tshow]');
    if(d){S.topics.saved=S.topics.saved.filter(t=>t.id!==d.dataset.tdel);save();render()}
    if(o){const t=S.topics.saved.find(x=>x.id===o.dataset.tshow);if(t){show(t);scrollTo({top:0,behavior:'smooth'})}}};
  show(genTopic('all'));
};

  const ct=continueTarget();

  <div class="card"><h3>📦 Overview</h3><p class="note">${summaryOf(S)} · course ${courseProgress()}%</p>${SESSIONS.map(s=>{const p=sprog(s);return`<div class="row" style="margin:2px 0"><span style="width:60px">S${s.id}</span><div class="bar" style="flex:1"><i style="width:${p.pct}%"></i></div><span class="note" style="width:40px">${p.pct}%</span></div>`}).join('')}</div>
  <div class="card"><h3>⬇️ Export</h3><p class="note">Download a backup file you can import on another device.</p><button class="btn s" id="pexp">Export progress (.json)</button></div>
  <div class="card"><h3>⬆️ Import</h3><p class="note">Importing replaces the progress on this device.</p><input type="file" id="pimp" accept="application/json,.json" aria-label="Choose a backup file"><p class="note">…or paste the backup text:</p><textarea id="ptxt" style="min-height:70px"></textarea><div class="row"><button class="btn s" id="pimpt">Import from text</button></div><div id="pimsg" class="note" role="status"></div></div>
  <div class="card"><h3>🗑️ Reset</h3><p class="note">Erases all progress, vocabulary schedules, saved topics and notes on this device.</p><button class="btn d" id="prst">Reset all progress…</button><div id="pcf" style="display:none" class="warn"><b>Are you sure?</b> This cannot be undone. Export a backup first if you might need it.<div class="row"><button class="btn d" id="pyes">Yes, erase everything</button><button class="btn s" id="pno">Cancel</button></div></div></div>`;
  $('#psave').onclick=()=>{save();$('#pst').textContent='Last saved: '+new Date().toLocaleString();toast('💾 Progress saved')};
  $('#pexp').onclick=()=>{const blob=new Blob([JSON.stringify({app:'shams-english',v:1,exported:new Date().toISOString(),state:S},null,1)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='shams-progress-'+today()+'.json';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);toast('⬇️ Backup downloaded')};
  const doImport=txt=>{
    const out=$('#pimsg');let o;
    try{o=JSON.parse(txt)}catch(e){out.textContent='❌ This is not valid backup data (could not read it).';return}
    const st=isObj(o)&&o.app==='shams-english'&&isObj(o.state)?o.state:(isObj(o)&&isObj(o.srs)?o:null);
    if(!st){out.textContent='❌ This file is not a Shams progress backup.';return}
    S=sane(st);save();out.textContent='✅ Imported: '+summaryOf(S);toast('✅ Progress imported');updateNav();setTimeout(render,900);
  };
  $('#pimp').onchange=e=>{const f=e.target.files[0];if(!f)return;if(f.size>5e6){$('#pimsg').textContent='❌ File is too large.';return}const r=new FileReader();r.onload=()=>doImport(String(r.result));r.onerror=()=>{$('#pimsg').textContent='❌ Could not read the file.'};r.readAsText(f)};
  $('#pimpt').onclick=()=>doImport($('#ptxt').value);
  $('#prst').onclick=()=>{$('#pcf').style.display='block'};$('#pno').onclick=()=>{$('#pcf').style.display='none'};
  $('#pyes').onclick=()=>{S=defState();try{localStorage.removeItem(STORE_KEY)}catch(e){}save();toast('Progress reset');updateNav();go('')};
};

registerSession({
 id:1,title:'Welcome to the World of Customer Service',subtitle:'Bridge & Fundamentals · CSR role, customer types, call-center terms, recruitment',level:'A2–B1',source:'https://traintohire.neocities.org/lesson1a2new',
 objectives:['Define customer service and explain the core role of a Customer Service Representative (CSR).','Identify key customer personalities and adapt your tone accordingly.','Apply essential call-center terminology in practical scenarios.','Differentiate between major call-center roles and leading international BPO companies.','Navigate the 4-stage recruitment pipeline and excel in basic interview responses.'],
 sections:{
  learn:[
   {h:'👋 Part One: Breaking the Ice',html:`<p><b>Introduce yourself &amp; language goals.</b> Prepare notes, then answer aloud:</p><ol><li>Introduce yourself (name, current studies or work background).</li><li>Why do you want to learn English?</li><li>How do you usually study languages?</li></ol><h4>🎮 Warm-up game: Would you rather…?</h4><p>Choose one option and give at least <b>two clear reasons</b>.</p><ul class="tight"><li>…work remotely from home forever OR work inside a busy call-center office?</li><li>…handle 50 short phone calls a day OR answer 10 complex email issues?</li><li>…speak fluent English immediately OR speak 3 languages at an intermediate level?</li><li>…receive higher pay with night shifts OR standard pay with fixed morning shifts?</li><li>…solve a difficult customer problem independently OR work on a team project?</li></ul>`},
   {h:'💡 What is customer service?',html:`<p>Customer service is the process of assisting customers <b>before, during, and after</b> purchasing a product or service. A <b>Customer Service Representative (CSR)</b> answers inquiries, resolves complex issues, provides accurate information, and ensures customer satisfaction.</p><p>To succeed as a CSR you combine technical skills with interpersonal skills: <b>active listening, patience, clear communication, and empathy</b>.</p>`},
   {h:'🧠 Understanding customer personalities',html:tableHTML({head:['Customer','Description','Strategy'],rows:[['😡 <b>Frustrated</b>','Dissatisfied because an unexpected problem occurred; may sound angry or demanding.','Stay calm, listen actively, show genuine empathy, focus on immediate solutions.'],['📊 <b>Analytical</b>','Needs precise details, structured facts and logical explanations.','Avoid vague statements. Give clear steps, exact numbers, verified policy facts.'],['🤔 <b>Indecisive</b>','Struggles to choose and feels overwhelmed by options.','Guide step by step, narrow down choices, give a confident recommendation.'],['🗣️ <b>Talkative</b>','Enjoys conversation and strays from the issue.','Acknowledge politely, then firmly redirect to the topic.'],['😶 <b>Silent</b>','Gives minimal details and one-word answers.','Ask targeted open-ended questions (what, how, when).'],['⚡ <b>Impatient</b>','Wants speed above all and expects immediate action.','Skip small talk, be efficient, deliver results quickly.']]})},
   {h:'👔 Major call-center roles',html:tableHTML({head:['Position','Core responsibilities'],rows:[['<b>Customer Service Rep (CSR)</b>','Assists existing customers: answers questions, troubleshoots, provides account support.'],['<b>Telemarketer</b>','Contacts prospective customers to introduce offerings, promote services, generate leads.'],['<b>Sales Representative</b>','Persuades clients to purchase or upgrade to hit monthly quotas.'],['<b>Appointment Setter</b>','Contacts qualified leads to schedule meetings for senior sales executives.']]})},
   {h:'🏢 Top international BPO companies',html:`<p><b>Teleperformance:</b> a global giant in over 80 countries, known for high-volume customer-experience operations and structured career progression.</p><p><b>Concentrix:</b> a major customer-experience provider partnering with top tech, e-commerce and financial corporations.</p><p><b>Sutherland:</b> a digital-transformation and customer-management company that blends tech support with corporate operations.</p>`},
   {h:'⚙️ Recruitment process & assessment pipeline',html:`<ol><li><b>Recruiter voice screening</b> — a voice recording to evaluate fluency, clarity, pronunciation and introductory confidence.</li><li><b>HR interview</b> — phone/video interview on background, soft skills, availability and motivation.</li><li><b>Operational role-play interview</b> — a live simulated customer interaction: problem-solving under pressure, etiquette, de-escalation.</li><li><b>Language &amp; computer assessment</b> — an automated test of grammar, listening, professional writing and typing speed.</li></ol>`}
  ],
  practice:{intro:`<p>Exercise 1, 2 and 4 are speaking tasks (see <b>Speaking Method</b>). Complete the written exercise and the three homework tasks here.</p>`,
   tasks:[
    {id:'ex3',h:'✍️ Exercise 3: Operational problem-solving vocabulary',html:`<p><i>“The technical system is running very slowly today. You have 40 calls waiting in line, and your current caller is getting angry because checking their account details is taking too long.”</i></p><p>Write 3–4 sentences explaining how you will handle it. Use <b>at least 4</b> of: Queue, Hold, Dead Air, Escalation, AHT, Ticket.</p>`,min:25,max:100,chk:['I used at least 4 of the 6 terms correctly']},
    {id:'hw1',h:'📝 Homework Task 1: Professional self-introduction',html:`<p>Write a formal <b>5–6 sentence</b> job-interview self-introduction: your background, key strengths, why you want to join customer service, and how you practise English daily.</p>`,min:50,chk:['I used past, present and future structures (e.g., “I have studied…”, “Currently I am working…”, “I aim to…”)']},
    {id:'hw2',h:'📝 Homework Task 2: Position analysis & skill matching',html:`<p>Choose ONE position (CSR, Sales Rep, Telemarketer or Appointment Setter). Write a short paragraph on <b>3 essential skills</b> for the role and why your personality fits.</p>`,min:40,chk:['I connected my traits to the job with linking words (because, therefore, such as)']},
    {id:'hw3',h:'📝 Homework Task 3: Customer email response',html:`<p>A customer received a wrong item. Write a formal email response (<b>60–80 words</b>) resolving the problem. Include <b>at least 4</b> target terms from today’s lesson (e.g., Account, Ticket, Resolution, Escalate, Verification, Hold).</p>`,min:60,max:80,chk:['Formal tone and proper greeting','Clear resolution steps','At least 4 target vocabulary terms']}
   ],
   rubric:`<ul class="tight"><li><b>Exercise 1:</b> 60 seconds without long pauses; used transition markers (however, in addition, on the other hand).</li><li><b>Exercise 2:</b> acknowledged frustration immediately before asking for verification; explained the <i>reason</i> for security verification.</li><li><b>Exercise 4:</b> showed empathy for the time-sensitive birthday delivery; offered a concrete action plan instead of blaming logistics.</li></ul>`}
 },
 vocabulary:[
  A('account','the client company or brand assigned to your department (e.g., Vodafone, Amazon)','I work on a telecom account.','work on an account',ADD),
  A('campaign','a targeted project managed by a team of agents for a specific client','Our team is running a new sales campaign.','launch a campaign',ADD),
  A('shift','your scheduled work hours (morning, night, split)','I prefer the morning shift.','night shift',ADD),
  A('queue','the electronic waiting line of calls or messages waiting for an agent','Because the incoming call queue is high, I need to keep my AHT efficient.','a long queue'),
  A('hold','to pause the live conversation to look up information or consult a specialist','Could I place you on hold for a moment?','put someone on hold',ADD),
  A('transfer','to route the caller to another department or senior specialist','I’ll transfer you to the billing department.','transfer a call',ADD),
  A('escalate','to forward a complex or unresolved issue to a supervisor or specialist team','I had to escalate the complaint to my supervisor.','escalate an issue',ADD),
  A('team leader','the direct manager who supervises and supports a team of agents','My team leader helps me with difficult calls.','',ADD),
  A('quality assurance','the department that monitors call recordings for quality, accuracy and compliance','Quality assurance listens to our calls every week.','',ADD),
  A('KPI','key performance indicator: a measurable metric used to evaluate agent performance','Customer satisfaction is one of my main KPIs.','meet your KPIs',ADD),
  A('AHT','average handle time: the average time spent handling a call from start to finish','I need to keep my AHT efficient without losing quality.','reduce AHT'),
  A('wrap-up','after-call work: admin tasks done right after a call','I write notes during wrap-up.','wrap-up time',ADD),
  A('script','a standard text that helps agents give accurate, compliant information','Please follow the script for security questions.','follow a script',ADD),
  A('headset','headphones and a microphone used for professional voice communication','Please check that your headset is working.','',ADD),
  A('dead air','unplanned silence during a call that sounds unprofessional','To avoid dead air, I tell the customer what I am doing.','avoid dead air'),
  A('ticket','a digital record created in the system to document a customer issue','I will open a support ticket to document the delay.','open a ticket'),
  A('resolution','the final answer or action that completely solves the problem','The resolution was a full refund.','provide a resolution',ADD),
  A('compliance','strictly following company rules, legal regulations and security policies','Compliance is very important when we handle payments.','',ADD)

    translate:TR_S2,
   html:`<p>We use the <b>Present Simple</b> for (1) daily routines and habits (<i>I drink coffee every day</i>), (2) facts that are always true (<i>The sun rises in the east</i>) and (3) permanent states (<i>She lives in New York</i>).</p><p><b>Verb “to be” (am / is / are)</b> — descriptions, age, feelings, jobs; no action. I <b>am</b> (I’m not) · He/She/It <b>is</b> (isn’t) · You/We/They <b>are</b> (aren’t).</p><p><b>Action verbs</b> — I/You/We/They use the base verb (<i>I work · I don’t work · Do I work?</i>); He/She/It add <b>-s/-es</b> (<i>He works · He doesn’t work · Does he work?</i>).</p><p class="note">Guess the rules: <i>“Meet Sarah. She <b>is</b> a teacher. She <b>wakes</b> up at 6:00 AM. She <b>drinks</b> coffee, but she <b>does not drink</b> tea. <b>Does</b> she like her job? Yes, she <b>does</b>!”</i></p>`,

  listen:{title:'A Day in My Life — Sara',note:'Questions written for this passage.',
    paras:['My name is Sara and I am a very <b>ambitious</b> student. My daily <b>routine</b> is simple. I wake up at six, I drink tea and I go to university by bus. I <b>frequently</b> study in the library after class because my main <b>objective</b> this year is to pass my exams.','My family is my first <b>priority</b>, so I have dinner with them every evening. We talk about our day, and my mother always gives me honest advice. I think she is a <b>genuine</b> friend, not only a mother.','In my <b>leisure</b> time, I read stories or draw. I believe that hard work helps you <b>achieve</b> your dreams, but rest is important too.'],
    quiz:[['When does Sara wake up?',['at five','at six','at seven'],1,'She says: I wake up at six.'],['What is her main objective this year?',['to pass her exams','to find a job','to travel'],0,'The passage says her main objective is to pass her exams.'],['Who does she have dinner with every evening?',['her friends','her family','her teacher'],1,'Her family is her first priority.'],['What does she do in her leisure time?',['plays football','reads stories or draws','watches TV'],1,'In her leisure time she reads stories or draws.']]},
   reading:{title:'Getting to Know You — David',paras:['Hello! My name is David, and I want to tell you a little bit about myself. People often tell me that I have a very genuine personality. I am usually very happy, honest, and friendly. I like to listen to my friends when they have problems, and I never lie to them. Being kind to others is my top priority in life. I believe that if you treat people well, they will treat you well in return. Sometimes I am shy, but I always try to smile.','My daily routine is very busy, but I like it that way. I wake up early every day at 6:30 AM. First, I eat a healthy breakfast and drink a big cup of hot coffee. Then, I take the bus to work. I work in a large office, and I frequently have important meetings with my team. We talk about new projects almost every day. After work, I do not like to sit on the sofa. I go to the gym or walk in the park. It is important to stay active.','I am also a very ambitious person. I have many big dreams for my future. My main objective this year is to learn a new language. I want to speak Spanish perfectly. To do this, I study every evening for forty minutes. Also, I want to start my own business one day. I am saving money every month to achieve this dream. It is not easy, but I work hard because I want to be successful.','In my leisure time, I have many hobbies to help me relax. I am very passionate about cooking. I love mixing different foods together to make something delicious. On the weekends, I go to the market, buy fresh vegetables, and cook for my family. It makes me feel great. I also enjoy reading history books and watching movies. These activities give me energy for the new week!']},

 speakingMethod:{name:'Z.O.O.M. Method',min:40,
  intro:'<p>Sometimes it is hard to know what to say when someone asks you to describe something. Use the <b>Z.O.O.M. method</b> to describe any scene, picture or person.</p>',
  stages:[{k:'Z',label:'Zoom out',desc:'Start with the big picture. Where are you? What is the overall feeling? (calm, busy, exciting?)',chunks:['It looks like…','The atmosphere is…']},{k:'O',label:'Observe',desc:'Focus on details: people, objects, clothing, colours, weather. What are they doing?',chunks:['I can see…','There is…','She is wearing…']},{k:'O',label:'Organize',desc:'Connect your ideas naturally: background → people → objects → atmosphere.',chunks:['First…','Then…','Also… in the background…']},{k:'M',label:'Make predictions',desc:'Imagine! What happened before? What will happen next? How are people feeling?',chunks:['I think … will…','Maybe…','She is probably…']}],
  extras:[{h:'🎮 The “Guess It” game',html:`<p>Think of something you are interested in (a hobby, a sport, a movie). Do <b>not</b> say its name. Describe it with Z.O.O.M.; your partner guesses.</p><p class="hint"><i>“I am thinking of an interest. (Zoom out) It happens outside in the sun. (Observe) You need a ball, two goals, and 22 people. People run very fast. (Organize) The fans wear colorful shirts and sing loudly. (Make predictions) I predict my favorite team will win the cup next year!”</i> — Partner: “Is it football?”</p>`},{h:'🧩 Which Z.O.O.M. step is it?',html:()=>quizHTML(ZQ_ITEMS,'q:2:z',2,'','Choose the step each sentence belongs to.')}],
  prompts:[{q:'Describe your room.',hint:'Zoom out (big picture) → Observe (colours, bed, desk) → Organize → Make predictions (what will you do here later?)'},{q:'Describe one person you know.',hint:'Zoom out (who are they?) → Observe (hair, eyes, clothes) → Organize (appearance, then personality) → Make predictions (their goals?)'},{q:'How many friends do you have? Describe three of them and compare them.',hint:'Zoom out (your friend group) → Observe (who is funny? who is quiet?) → Organize → Make predictions (what will you do this weekend?)'}]}

 sections:{

   reading:{title:'The Psychology of Free Time',paras:['In today’s fast-paced, hyper-connected society, the concept of free time has evolved significantly. Many adults experience severe burnout due to the relentless demands of their careers and daily obligations. Consequently, psychologists emphasize that having time away from work is not a luxury, but an absolute necessity for mental health. To effectively unwind after a stressful week, experts suggest that people need more than just passive rest like watching television; they need active engagement in meaningful activities.','This is where hobbies play a crucial role. A hobby provides a dedicated space where individuals can immerse themselves in something completely separate from their professional lives. When you are truly passionate about a topic, whether it is learning Italian, painting, or writing novels, your brain shifts into a state of flow. This psychological state reduces anxiety and promotes a profound sense of well-being.','Many people choose to pursue activities that offer a creative outlet. For instance, creating art or playing a musical instrument can be incredibly rewarding, as you can physically see the progress you make over time. Others prefer hobbies that are simply amusing, such as playing virtual games with friends or solving puzzles, which introduce joy and laughter into routine days.','Furthermore, hobbies can be deeply fascinating. Reading historical fiction or studying astronomy expands our understanding of the world, keeping our minds sharp and curious. While finding the energy to start a new activity can be challenging, choosing to dedicate even a few hours a week to personal recreation can drastically improve your overall quality of life, transforming you from a stressed worker into a well-rounded, fulfilled individual.']},

  grammar:{topic:'Present Simple vs Present Continuous',videoTopic:'Present Simple vs Present Continuous',
   html:`<p><b>Present Simple:</b> facts, habits, permanent states (<i>I live in Cairo.</i>)<br><b>Present Continuous:</b> actions happening now, temporary situations, fixed future plans (<i>I am staying in Alexandria this week.</i>)</p><h4>🤫 Native secrets</h4><ul class="tight"><li><b>Emphasis:</b> use do/does in positive sentences — “I like tea.” → “I <b>do</b> like tea!”</li><li><b>Annoyance:</b> always + Present Continuous — “He is <b>always</b> leaving his clothes on the floor!”</li><li><b>State verbs</b> (know, believe, love, understand) are almost never continuous.</li></ul>`,
   open:['<b>Correct the mistakes:</b> 1) I am not understanding this math problem. 2) She is always complain about the weather! 3) We go to the cinema tonight. I bought the tickets yesterday.','<b>Rewrite for emphasis with do/does:</b> “I enjoy watching old movies.” / “She studies very hard for her exams.”','<b>Role-play:</b> You call a friend. Ask what they are doing right now, then ask about their normal morning routine.'],

  reading:{title:'The Evolution of Screen Time',paras:['The landscape of entertainment has transformed drastically over the past decade. In the past, people would eagerly await the premiere of a highly anticipated movie at their local cinema, standing in long queues just to secure a good seat. Today, technological advancements and streaming platforms have completely rewritten the rules, allowing audiences to consume media instantly from the comfort of their living rooms. We now have the freedom to binge-watch entire seasons of television in a single weekend, creating a culture of immediate gratification.','At the heart of every successful production lies a powerful narrative. Every great story relies on a strong protagonist who must face impossible odds or complex moral dilemmas. The foundation of this journey is the screenplay, which carefully dictates not just the dialogue the actors speak, but the pacing and emotional tone of the entire narrative. When these elements are perfectly balanced, the result is a truly captivating experience that keeps viewers completely glued to their screens, ignoring the outside world.','However, because there is such an overwhelming abundance of content available today, viewers have become incredibly selective about the specific genre they choose to invest their time in. After a long, exhausting day at work, some individuals prefer lighthearted comedy series to unwind, while others actively seek out the adrenaline rush provided by intense psychological thrillers. Additionally, the visual appeal of a film, known as the cinematography, plays a massive role in building the atmosphere and drawing the audience deeper into the director’s unique vision.','Despite all these massive changes in how we consume media, one fundamental rule of entertainment remains universal: nobody likes a spoiler. In the age of social media, carelessly discussing a crucial plot twist online can easily ruin the entire experience for millions of other fans. Ultimately, whether you are sitting in a packed theater watching a massive summer blockbuster or relaxing at home viewing a quiet independent film, the magical power of storytelling continues to connect us all.']},

  intro:'<p>Native speakers are natural storytellers: they follow a structure, not a list of events. Use <b>SPARF</b> for a memory, a movie, a book or an interview question.</p>',
  stages:[{k:'S',label:'Story',desc:'Set the scene: who, what, where, when?',chunks:['It all started when…','A few years ago…','The story is set in…']},{k:'P',label:'Progress',desc:'How did the situation develop? Build the tension.',chunks:['As time went on…','Unexpectedly…','Things took a turn when…']},{k:'A',label:'Action',desc:'The climax: the main event or problem-solving.',chunks:['Suddenly, I realized…','The main character decided to…','Without hesitation…']},{k:'R',label:'Result',desc:'What was the final outcome?',chunks:['In the end…','As a result…','Eventually, it turned out that…']},{k:'F',label:'Feedback',desc:'Reflection: what did you learn or feel?',chunks:['Looking back, I realize…','It taught me that…','It completely changed my perspective on…']}],

  grammar:{topic:'Countable & uncountable nouns',videoTopic:'Countable and Uncountable Nouns',
   html:`<p><b>Countable nouns</b> have singular and plural forms. Use with <i>a/an, many, few, a few, several, How many…?</i> — “Hind only made a <b>few</b> mistakes.” “How <b>many</b> interviews did Youssef have?”</p><p><b>Uncountable nouns</b> usually have no plural (concepts, materials, liquids). Use with <i>much, little, a little, some, any, enough, a lot of, How much…?</i> — “Mariam gave me <b>some</b> valuable feedback.” “We don’t have <b>enough</b> equipment.”</p><h4>⚠️ The danger zone — almost always uncountable</h4><p>advice, information, feedback, knowledge, evidence, equipment, furniture, homework, progress, research, work, traffic, accommodation, software, baggage, luck, permission.</p><p>❌ an advice, many informations, several feedbacks, an equipment<br>✅ some advice, useful information, valuable feedback, a piece of equipment</p>`,

  reading:{title:'The Modern Dining Experience',paras:['Going out to a restaurant is no longer just about satisfying an appetite; it is a multi-sensory journey. When you step into an upscale establishment, the first thing you notice is the atmosphere—the ambient lighting, the soft music, and the way the tables are arranged all contribute to the mood. The true magic, however, happens in the kitchen. Here, culinary experts work tirelessly to blend fresh, nutritious ingredients into complex dishes.','A great chef respects the origins of their food, often striving to create authentic dishes that honor traditional cooking methods from a specific culture. Instead of a bland meal rushed during a lunch break, these professionals craft plates designed for you to truly savor every single bite. The visual presentation is equally important; a dish must look appetizing before it is even tasted.','Furthermore, fine dining has adapted to modern sensibilities. While historical feasts featured massive quantities of food, modern high-end restaurants focus on a carefully measured portion size. This ensures the guest can enjoy multiple courses—from a delicate starter to an exquisite dessert—without feeling overly full. Ultimately, dining out is an art form that transforms basic sustenance into a memorable event.']},

  intro:'<p>Use the <b>Zoom Method</b> to describe culinary scenes: start with the <b>general</b> impression, zoom in to <b>specific</b> things you can see, then add <b>detail</b> or your opinion. After drafting, compare with the model.</p>',

 sections:{
  pron:{intro:'<p>Regular past verbs end in <b>-ED</b>, but it is not always pronounced “ed”.</p>',
   blocks:[{h:'Sound 1: /ɪd/ — an extra syllable',html:'<p>After a <b>T or D</b> sound: <i>want → wanted, need → needed, decide → decided.</i></p>'},{h:'Sound 2: /t/ — a crisp T',html:'<p>After an <b>unvoiced</b> sound (P, K, F, S, SH, CH): <i>look → looked, wash → washed, dress → dressed, shop → shopped.</i></p>'},{h:'Sound 3: /d/ — a soft D',html:'<p>After a <b>voiced</b> sound or vowel (L, N, R, G, V, Z, B, M): <i>clean → cleaned, play → played, try → tried.</i></p>'},{h:'Linking words that end in ‘T’',html:'<p><b>Glottal T (before a consonant):</b> the air stops in the throat — “It’s abou[t] me.” “I bough[t] shoes.” “Wha[t] color?”<br><b>Flap T (before a vowel):</b> it sounds like a quick soft D — “It’s abou[d]it.” “I bough[d]an apple.” “Wha[d]is it?”</p>'}],

   passage:'I walked to the store because I needed a new coat. I looked at about twenty different styles, but none of them worked. Finally, I tried on a blue jacket. I thought about it for a minute, and then I bought it!'},
  grammar:{topic:'Articles: a / an / the / no article',videoTopic:'Articles a an the',
   html:`<p class="note">Read the story, then check the rules: <i>“Yesterday, I wanted to buy a gift for my sister. We live on Planet Earth… I went to <b>a</b> new Italian boutique downtown. <b>The</b> boutique was stunning. I saw <b>a</b> dress and <b>an</b> elegant scarf. <b>The</b> dress was too expensive, but <b>the</b> scarf was perfect. Generally, I don’t care much about fashion or shoes…”</i></p><ul class="tight"><li><b>First mention = a/an; second mention = the</b> (“a new boutique… the boutique”).</li><li><b>an</b> before a <i>vowel sound</i> (an elegant scarf).</li><li><b>No article</b> for general plurals or uncountable nouns (“I love cats.” “Water is healthy.”) and for cities/countries (Egypt, Italy).</li></ul><p><b>The (definite):</b> specific things, second mentions, unique things (the sun, the Earth), superlatives (the best).<br><b>A/An (indefinite):</b> singular countable nouns, general things, jobs (I am a teacher).<br><b>Zero article (Ø):</b> general plurals, general uncountables, cities/countries.</p>`,
   open:['<b>Situation A:</b> You are in a restaurant. You want water, but not a specific bottle — any water, generally. What do you ask?','<b>Situation B:</b> Your friend is holding a bottle of water. You want THAT exact bottle. What do you say?'],
   quiz:{note:ADDQ,items:[['I saw _____ elegant scarf in the window.',['a','an'],1,'“Elegant” starts with a vowel sound → an.'],['I bought a dress. _____ dress was blue.',['A','The'],1,'Second mention → the.'],['I love _____ cats.',['the','— (no article)'],1,'General plural → no article.'],['She is _____ teacher.',['a','the'],0,'Jobs use a/an.'],['_____ sun rises in the east.',['A','The'],1,'Unique things → the.']]}},
  reading:{title:'The Fast Fashion Dilemma',paras:['Shopping for clothes has changed dramatically in recent years. In the past, people viewed clothing as an investment. They would buy a few high-quality garments that served as a wardrobe staple for many years. Today, however, the industry is dominated by “fast fashion.” This means that brands produce cheap, low-quality clothes rapidly to match whatever is currently trendy on social media.','While it is incredibly tempting to grab a beautiful dress that seems like a massive bargain, these deals often come with a hidden cost. Many of these items are poorly made and become outdated within just a few months. As a result, consumers find themselves constantly buying new outfits. They often make an impulse buy at the checkout counter, purchasing accessories or shirts they never actually planned to get.','Sometimes, shopping in luxury stores isn’t much better. You might find a gorgeous Italian designer suit that happens to fit like a glove, making you look absolutely perfect. But when you look at the price tag, you realize it costs thousands of dollars! Many shoppers feel that these extreme luxury prices are a complete rip-off, paying entirely for the logo rather than the fabric. Despite this, some customers remain fiercely brand loyal, refusing to wear anything unless it has their favorite designer’s name on it.','Fortunately, a new movement is growing among younger consumers who are tired of this endless cycle. Instead of spending their weekends at the mall, many prefer window shopping with friends, enjoying the visual displays without spending a single penny. Furthermore, there is a rising demand for sustainable fashion. Shoppers are now looking for second-hand stores or ethical brands that care about the environment on Planet Earth. By choosing quality over quantity, we can look stylish while also making smarter, more responsible choices for our wallets and our world.']},
